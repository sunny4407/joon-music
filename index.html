<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123B33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="준뮤직">
<title>준뮤직</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123B33'/%3E%3Cpath d='M26 44V18l20-4v26' fill='none' stroke='%23D9B877' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='44' r='6' fill='%23D9B877'/%3E%3Ccircle cx='41' cy='40' r='6' fill='%23D9B877'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 한 손으로 쓰는 세로 화면: 진초록 머리띠 + 맑은 바탕의 목록 */
:root{
  --green:#123B33; --green-2:#1C4A40; --gold:#D9B877; --gold-ink:#8E6E33;
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#1F2523; --muted:#5F6663; --line:#E3E6E2;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif; --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* 머리띠 */
.hero{background:var(--green);color:#fff;padding-top:calc(30px + env(safe-area-inset-top,0px));padding-bottom:28px;text-align:center}
.eyebrow{font-size:15px;letter-spacing:.3em;color:var(--gold);font-weight:500}
.hero h1{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.4;margin:10px 0 0;text-wrap:balance}
.mic{margin:18px auto 0;width:132px;height:132px;border-radius:50%;border:1.5px solid rgba(217,184,119,.6);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mic span{width:104px;height:104px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;transition:background .2s}
.mic.on{border-color:#fff}.mic.on span{background:#fff}
.mic-label{margin-top:10px;font-size:19px;font-weight:500}
.mic-hint{margin-top:2px;font-size:16px;color:rgba(255,255,255,.72)}

main{display:flex;flex-direction:column;gap:34px;padding-block:24px 40px}
.search{display:flex;align-items:center;gap:8px;height:60px;padding:0 7px 0 20px;background:var(--surface);border:1px solid #D6DBD7;border-radius:30px}
.search input{flex:1;min-width:0;height:56px;border:0;outline:0;background:transparent;font-size:19px;color:var(--ink)}
.search input::placeholder{color:#7A807D}
.circle-btn{width:46px;height:46px;flex-shrink:0;border:0;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:baseline;gap:10px}
.sec-head h2{margin:0;font-family:var(--serif);font-size:23px;font-weight:700}
.tag{font-size:13px;letter-spacing:.2em;color:var(--gold-ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.genre-label{grid-column:1/-1;font-family:var(--serif);font-size:18px;font-weight:700;color:var(--green);padding:6px 2px 0}
.tile{min-height:96px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left;cursor:pointer;color:var(--ink)}
.tile .cnt{font-size:14px;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.tile b{font-size:19px;line-height:1.3}
.tile small{font-size:15px;color:var(--muted);line-height:1.35}
.row-link{min-height:54px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;font-size:18px;font-weight:700;color:var(--ink)}
.row-link span:first-child{flex:1;text-align:left}
.row-link .n{font-size:15px;font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;padding:0 20px;border-radius:25px;border:1px solid #CBD1CC;background:var(--surface);font-size:18px;font-weight:500;color:var(--ink);cursor:pointer}
.chip.more{border-color:var(--green);color:var(--green)}

/* 곡 목록 */
.songs{display:flex;flex-direction:column;border-top:1px solid #D6DBD7}
.song{display:flex;align-items:center;gap:14px;min-height:78px;padding:10px 2px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.song .t{flex:1;min-width:0;display:flex;flex-direction:column}
.song .t b{font-size:20px;line-height:1.35}
.song .t span{font-size:16px;color:var(--muted)}
.play-dot{width:48px;height:48px;border-radius:50%;border:1px solid var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.heart-mark{color:var(--gold-ink);font-size:15px;margin-left:4px}
.empty{padding:22px 4px;font-size:17px;color:var(--muted);line-height:1.6}
.small-btn{min-height:44px;padding:0 16px;border:1px solid var(--green);border-radius:22px;background:transparent;color:var(--green);font-size:16px;font-weight:500;cursor:pointer}

/* 목록 화면 */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:6px}
.back{min-height:52px;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-size:19px;font-weight:500;color:var(--green);cursor:pointer;padding:0 6px 0 0}
.list-head{display:flex;flex-direction:column;gap:6px;padding-block:6px 18px}
.list-head h1{margin:0;font-family:var(--serif);font-size:30px;font-weight:700;text-wrap:balance}
.list-head .n{font-size:16px;color:var(--muted)}
.list-actions{display:flex;flex-direction:column;gap:10px;padding-bottom:18px}
.playall{min-height:62px;border-radius:31px;border:0;background:var(--green);color:#fff;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
.ytall{min-height:52px;border-radius:26px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-size:17px;font-weight:700;cursor:pointer;width:100%}
.song.edit{cursor:default}
.del-btn{min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid #B4533F;background:#fff;color:#B4533F;font-size:17px;font-weight:700;cursor:pointer;flex-shrink:0}
.blocked{position:absolute;inset:0;z-index:2;background:#101614;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;font-size:18px;line-height:1.45}
.blocked a{min-height:52px;padding:0 24px;border-radius:26px;background:var(--gold);color:var(--green);font-size:19px;font-weight:700;display:inline-flex;align-items:center;text-decoration:none}

/* 재생 화면 */
#player{background:var(--green);min-height:100vh;color:#fff}
#player .back{color:var(--gold)}
#player .topbar{background:var(--green)}
.video{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.now{text-align:center;padding-block:12px 0}
.deck{position:relative;left:11px;width:126px;height:104px;margin:0 auto 6px}
.deck .vinyl{position:absolute;left:4px;top:4px;margin:0}
.arm{position:absolute;left:0;top:0;width:126px;height:104px;overflow:visible;pointer-events:none;
  transform-origin:113px 16px;transform:rotate(-24deg);transition:transform .9s cubic-bezier(.4,0,.2,1)}
.arm.on{transform:rotate(0deg)}
@media (prefers-reduced-motion:reduce){.arm{transition:none}}
.vinyl{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;position:relative;
  background:
    radial-gradient(circle at 50% 50%, #0d1714 0 22%, transparent 22.5%),
    repeating-radial-gradient(circle at 50% 50%, #151b19 0 1.6px, #222a27 1.6px 3.2px),
    #151b19;
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
  animation:spin 6s linear infinite; animation-play-state:paused}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 20deg, transparent 0 10%, rgba(255,255,255,.13) 15%, transparent 22% 60%, rgba(255,255,255,.10) 65%, transparent 72%)}
.vinyl .vlab{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--gold);z-index:1}
.vinyl .vlab b{position:absolute;left:0;right:0;top:5px;text-align:center;font:italic 700 11px/1 var(--serif);color:var(--green);letter-spacing:.02em}
.vinyl .vlab i{position:absolute;left:50%;bottom:7px;width:12px;height:1.5px;margin-left:-6px;background:var(--green);opacity:.7}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#0d1714;z-index:2}
.vinyl.on{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.now h1{margin:0;font-family:var(--serif);font-size:30px;font-weight:700;text-wrap:balance}
.now p{margin:6px 0 0;font-size:20px;color:rgba(255,255,255,.82)}
.controls{display:flex;align-items:center;justify-content:center;gap:26px;padding-block:14px 8px}
.ctl{width:72px;height:72px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ctl.big{width:96px;height:96px;border:0;background:var(--gold)}
.pl-actions{display:flex;flex-direction:column;gap:12px;padding-block:6px 30px}
.wide{min-height:62px;border-radius:31px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
.wide.on{background:var(--gold);color:var(--green)}
.switch{min-height:58px;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:14px;font-size:19px;font-weight:700;cursor:pointer;width:100%;padding:0 4px}
.switch .lab{flex:1;text-align:left}
.track{width:64px;height:36px;border-radius:18px;background:rgba(255,255,255,.3);padding:3px;display:flex;transition:background .2s}
.knob{width:30px;height:30px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--gold)}
.switch[aria-checked="true"] .knob{transform:translateX(28px)}
.state{width:28px;font-size:18px;color:rgba(255,255,255,.8)}
.ended{margin:0 0 4px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.1);font-size:18px;text-align:center}

/* 모든 화면 위 제목 + 아래 고정 버튼 */
.apphead{position:sticky;top:0;z-index:6;background:var(--green);color:var(--gold);text-align:center;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.12em;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;border-bottom:1px solid rgba(217,184,119,.25)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--green);border-top:1px solid rgba(217,184,119,.3);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bottombar .in{display:flex;gap:10px}
.navbtn{flex:1;min-height:64px;border-radius:16px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.navbtn.main{background:var(--gold);color:var(--green)}
#list,#player{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.ctl-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctl-wrap span{font-size:17px;color:rgba(255,255,255,.85)}
.ctl-wrap.big span{color:var(--gold);font-weight:700;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;font-size:17px;max-width:calc(100% - 40px);z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* LP 앨범 속지 콘셉트: 흰 바탕 + 진초록 선 + 명조 제목 + 트랙 번호 */
:root{--bg:#FFFFFF;--ink:#14201C;--muted:#69716E;--line:#E4E7E5;--rule:#123B33}
main{gap:40px;padding-block:28px 48px}
.search{border:1.5px solid var(--rule);border-radius:8px;background:#fff;height:62px}
.circle-btn{border-radius:6px}
.sec{gap:0;border-top:2px solid var(--rule);padding-top:14px}
.sec-head{align-items:baseline;margin-bottom:6px}
.sec-head h2{font-size:25px;color:var(--ink);letter-spacing:-.01em}
.tag{display:none}
.list-head .tag{display:none}
.grid{display:flex;flex-direction:column;gap:0}
.genre-label{display:flex;align-items:baseline;gap:10px;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--gold-ink);padding:18px 0 6px;border-bottom:1px solid var(--line)}
.genre-label em{font-style:normal;letter-spacing:0;font-size:16px;color:var(--ink);font-family:var(--serif)}
.tile{flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;min-height:84px;padding:12px 2px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.tile .no{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--gold-ink);width:32px;flex-shrink:0;font-variant-numeric:tabular-nums}
.tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tile b{font-family:var(--serif);font-size:23px;font-weight:700;color:var(--ink)}
.tile small{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cnt{font-size:16px;font-weight:700;color:var(--rule);white-space:nowrap}
.tile .arr{flex-shrink:0}
.row-link{margin-top:14px;min-height:60px;border:1.5px solid var(--rule);border-radius:8px;background:#fff;font-size:19px;color:var(--rule)}
.row-link .n{color:var(--rule);font-weight:700}
.chips{gap:8px;padding-top:12px}
.chip{border-radius:8px;border:1px solid #C9CFCC;background:#fff;font-weight:700;color:var(--ink);min-height:52px}
.chip.more{border:1.5px solid var(--rule);color:var(--rule)}
.songs{border-top:0}
.song{border-bottom:1px solid var(--line);gap:14px}
.song .no{font-family:var(--serif);font-size:18px;color:var(--gold-ink);width:28px;flex-shrink:0;font-variant-numeric:tabular-nums}
.song .t b{font-size:20px;color:var(--ink)}
.play-dot{border:1.5px solid var(--rule);width:46px;height:46px}
.small-btn{border-radius:8px;border-color:var(--rule);color:var(--rule);font-weight:700}
.list-head{border-bottom:2px solid var(--rule);padding-bottom:16px;margin-bottom:18px}
.list-head h1{color:var(--ink)}
.list-head .n{color:var(--gold-ink);font-weight:700;letter-spacing:.04em}
.playall{border-radius:8px}
.ytall{border-radius:8px;border-color:var(--rule);color:var(--rule);background:#fff}
.del-btn{border-radius:8px}
.sec-head h2{border:0;padding-left:0}

/* 와인 팔레트: 같은 계열 농도 + 크림 */
:root{--wine:#123B33;--deep:#0B2A23;--bright:#2B6B59;--blush:#EAF2EE}
.hero{background:radial-gradient(120% 90% at 50% 0%,#2B6B59 0%,#123B33 45%,#0B2A23 100%)}
.eyebrow{color:#D9B877;opacity:.9}
.mic{border-color:rgba(217,184,119,.55);box-shadow:0 0 0 10px rgba(217,184,119,.06)}
.mic span{background:linear-gradient(160deg,#F0DDB0,#D9B877);box-shadow:0 8px 24px rgba(4,24,18,.35)}
.apphead{background:linear-gradient(180deg,#123B33,#0B2A23);color:#D9B877}
.bottombar{background:#0B2A23}
.navbtn{border-color:rgba(217,184,119,.7);color:#D9B877}
.navbtn.main{background:#D9B877;color:#0B2A23}
#player{background:radial-gradient(120% 70% at 50% 30%,#2B6B59 0%,#123B33 45%,#0B2A23 100%)}
#player .topbar{background:transparent}
.ctl.big{background:linear-gradient(160deg,#F0DDB0,#D9B877);box-shadow:0 10px 26px rgba(4,24,18,.4)}
.ctl-wrap.big span{color:#D9B877}
.wide{border-color:rgba(217,184,119,.7);color:#D9B877}
.wide.on{background:#D9B877;color:#0B2A23}
.playall{background:linear-gradient(135deg,#2B6B59,#123B33 55%,#0B2A23);box-shadow:0 6px 16px rgba(18,59,51,.28)}
.tile:active,.song:active,.chip:active{background:var(--blush)}
.chip.more{background:var(--blush)}
.genre-label{color:#8E6E33}
.tile .no,.song .no{color:#2B6B59}
.tile .cnt{color:#123B33}
.sec{border-top-color:#123B33}
.list-head{border-bottom-color:#123B33}
.search{border-color:#123B33}
.circle-btn{background:linear-gradient(135deg,#2B6B59,#0B2A23)}
.vinyl .vlab{background:#D9B877}
.vinyl .vlab b,.vinyl .vlab i{color:#123B33}
.vinyl .vlab i{background:#123B33}
.blocked a{background:#D9B877;color:#0B2A23}
.gift{display:flex;align-items:center;gap:14px;width:100%;min-height:96px;padding:12px 14px 12px 12px;border:0;border-radius:14px;background:linear-gradient(135deg,#2B6B59,#123B33 60%,#0B2A23);color:#fff;text-align:left;cursor:pointer;box-shadow:0 8px 20px rgba(4,24,18,.22)}
.gift img{width:72px;height:72px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#0B2A23}
.gift .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gift .gt small{font-size:13px;letter-spacing:.18em;color:#D9B877;font-weight:700}
.gift .gt b{font-family:var(--serif);font-size:23px;line-height:1.25}
.gift .gt span{font-size:15px;color:rgba(255,255,255,.8)}
.gift .gp{width:50px;height:50px;border-radius:50%;background:linear-gradient(160deg,#F0DDB0,#D9B877);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.audiobox{position:absolute;inset:0;z-index:1;background:#0B2A23;display:flex;align-items:center;justify-content:center}
.audiobox img{height:100%;aspect-ratio:1/1;object-fit:cover}
</style>
</head>
<body>

<!-- 첫 화면 -->
<section id="home">
  <div class="hero pad">
    <div class="eyebrow">JOON MUSIC</div>
    <div style="margin-top:6px;font-size:15px;color:rgba(255,255,255,.72)">최홍준님의 애창곡</div>
    <h1>오늘은 어떤 노래를<br>들어볼까요?</h1>
    <button class="mic" id="micBtn" aria-label="눌러서 노래 제목 말하기"><span>
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#123B33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
    </span></button>
    <div class="mic-label" id="micLabel">눌러서 말하기</div>
    <div class="mic-hint">예) "조용필 허공"</div>
  </div>
  <main class="wrap pad">

function norm(s){return (s||'').toLowerCase().replace(/[\s\(\)\[\]·.,!?'"-]/g,'');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const playIcon = '<span class="play-dot"><svg width="18" height="18" viewBox="0 0 24 24" fill="#123B33" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>';
function songRows(list, holder){
  holder.innerHTML = list.length ? list.map((s,k)=>`<button class="song" type="button" data-k="${k}"><span class="no">${String(k+1).padStart(2,'0')}</span><span class="t"><b>${esc(s.title)}${favs.includes(s.id)?'<span class="heart-mark">♥</span>':''}</b><span>${esc(s.artistLabel)}</span></span>${playIcon}</button>`).join('')
    : '<p class="empty">찾는 노래가 없어요. 제목의 일부나 가수 이름으로 다시 찾아보세요.</p>';
  holder.querySelectorAll('.song').forEach(b=>b.addEventListener('click',()=>play(list, +b.dataset.k)));
}

/* 화면 전환 + 휴대폰 뒤로가기 버튼 지원 */
function show(view){['home','list','player'].forEach(v=>$('#'+v).hidden = v!==view); window.scrollTo(0,0);}
function go(view, data){history.pushState({view, data}, ''); render(view, data);}
function render(view, data){
  if(view!=='player') stopVideo();
  if(view==='home'){favEdit=false; renderHome(); show('home');}
  if(view==='list'){openList(data); show('list');}
  if(view==='player'){show('player');}
}
window.addEventListener('popstate', e=>{const s=e.state||{view:'home'}; if(s.view==='player'){render('home');} else render(s.view, s.data);});
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>history.back()));

  $('#moodGrid').querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>go('list',{type:'mood',key:b.dataset.m})));
  $('#allCount').textContent = SONGS.length+'곡';
  const counts = {}; SONGS.forEach(s=>counts[s.artist]=(counts[s.artist]||0)+1);
  const top = ['조용필','송골매','남진','전영록','최헌','양수경','미스터팡'];
  $('#artistChips').innerHTML = top.map(a=>`<button class="chip" type="button" data-a="${a}">${a}</button>`).join('') + '<button class="chip more" type="button" data-a="*">전체 가수 ›</button>';
  $('#artistChips').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=> b.dataset.a==='*' ? go('list',{type:'artists'}) : go('list',{type:'artist',key:b.dataset.a})));
  let fav = SONGS.filter(s=>favs.includes(s.id));
  const played = SONGS.filter(s=>plays[s.id] && !favs.includes(s.id)).sort((a,b)=>plays[b.id]-plays[a.id]).slice(0, Math.max(0, 5-fav.length));
  let list = fav.concat(played);
  $('#editFavBtn').hidden = !list.length;
  $('#editFavBtn').textContent = favEdit ? '다 했어요' : '정리하기';
  if(favEdit){
    if(!list.length){ favEdit=false; $('#editFavBtn').hidden=true; }
    else {
      $('#favList').innerHTML = list.map(s=>`<div class="song edit"><span class="t"><b>${esc(s.title)}</b><span>${esc(s.artistLabel)}</span></span><button class="del-btn" type="button" data-id="${s.id}">빼기</button></div>`).join('');
      $('#favList').querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;
        favs=favs.filter(x=>x!==id); store.set('favs',favs); delete plays[id]; store.set('plays',plays); toast('자주 듣는 곡에서 뺐어요.'); renderHome();}));
      return;
    }
  }
  if(!list.length) list = SONGS.filter(s=>['NKzCydhgHwI','i0x76xs0bq4','kYCVzpSsH3s'].includes(s.id));
  songRows(list, $('#favList'));
}

/* 목록 화면 */
function openList(d){
  let title='', tag='', list=[];
  if(d.type==='mood'){const m=MOODS.find(x=>x.id===d.key); title=m.name; tag='GENRE'; list=SONGS.filter(s=>s.g===d.key).sort(byTitle);}
  if(d.type==='artist'){title=d.key; tag='ARTIST'; list=SONGS.filter(s=>s.artist===d.key).sort(byTitle);}
  if(d.type==='all'){title='전체 곡'; tag='ALL'; list=SONGS.slice().sort(byTitle);}
  if(d.type==='search'){title=`"${d.key}" 찾은 결과`; tag='SEARCH'; const q=norm(d.key); const words=d.key.trim().split(/\s+/).map(norm).filter(Boolean);
    list=SONGS.filter(s=>{const h=norm(s.title+s.artist); return h.includes(q) || (words.length>1 && words.every(w=>h.includes(w)));});}
  $('#listActions').hidden = true;
  if(d.type==='artists'){
    const counts={}; SONGS.forEach(s=>counts[s.artist]=(counts[s.artist]||0)+1);
    const names=Object.keys(counts).sort((a,b)=>a.localeCompare(b,'ko'));
    $('#listTag').textContent='ARTIST'; $('#listTitle').textContent='전체 가수'; $('#listCount').textContent=names.length+'명';
    $('#listBody').innerHTML = names.map(a=>`<button class="song" type="button" data-a="${esc(a)}"><span class="t"><b>${esc(a)}</b><span>${counts[a]}곡</span></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E6E33" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`).join('');
    $('#listBody').querySelectorAll('.song').forEach(b=>b.addEventListener('click',()=>go('list',{type:'artist',key:b.dataset.a})));
    return;
  }
  $('#listTag').textContent=tag; $('#listTitle').textContent=title; $('#listCount').textContent=list.length+'곡';
  songRows(list, $('#listBody'));
  curList = list; $('#listActions').hidden = list.length < 2;
  $('#ytAllBtn').href = 'https://www.youtube.com/watch_videos?video_ids=' + list.slice(0,50).map(s=>s.id).join(',');
  $('#ytAllBtn').textContent = list.length>50 ? '유튜브 앱으로 전체 듣기 (앞 50곡)' : '유튜브 앱으로 전체 듣기';
}

/* 말로 찾기 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$('#micBtn').addEventListener('click',()=>{
  if(!SR){toast('이 휴대폰에서는 말로 찾기가 안 돼요. 글자로 찾아 주세요.'); $('#q').focus(); return;}
  const r = new SR(); r.lang='ko-KR'; r.interimResults=false; r.maxAlternatives=1;
  $('#micBtn').classList.add('on'); $('#micLabel').textContent='듣고 있어요…';
  r.onresult = e=>{const t=e.results[0][0].transcript; $('#q').value=t; go('list',{type:'search',key:t});};
  r.onerror = ()=>toast('잘 못 들었어요. 한 번 더 말씀해 주세요.');
  r.onend = ()=>{$('#micBtn').classList.remove('on'); $('#micLabel').textContent='눌러서 말하기';};
  try{r.start();}catch(e){r.onend();}
});

/* 재생 */
function play(list, k){
  queue = list; qPos = k;
  if($('#player').hidden) history.pushState({view:'player'}, '');
  loadCurrent(); show('player');
}
function loadCurrent(){
  const s = queue[qPos]; if(!s) return;
  plays[s.id]=(plays[s.id]||0)+1; store.set('plays',plays);
  $('#nowTitle').textContent=s.title; $('#nowArtist').textContent=s.artist;
  $('#endedMsg').hidden = true; userPaused = false; lastT = 0; $('#blocked').hidden = true; clearTimeout(skipT);
  $('#blockedLink').href = 'https://www.youtube.com/watch?v=' + s.id;
  $('#ytLink').href = 'https://www.youtube.com/watch?v=' + s.id;
  setPlaying(true);
  $('#ytLink').parentElement.hidden = !!s.audio;
  if(s.audio){ if($('#yt')&&ytReady) ytCmd('pauseVideo'); showAudio(s); updateFav(); return; }
  hideAudio();
  /* 이미 만든 유튜브 화면이 있으면 그 안에서 영상만 바꿔요 (유튜브 앱 재생목록처럼 이어서 재생) */
  const cur=$('#yt');
  if(cur && ytReady){ ytCmdArgs('loadVideoById',[s.id]); cur.title=s.title; updateFav(); return; }
  ytReady=false;
  const origin = encodeURIComponent(location.origin && location.origin!=='null' ? location.origin : '');
  $('#video').innerHTML = `<iframe id="yt" src="https://www.youtube.com/embed/${s.id}?autoplay=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1${origin?'&origin='+origin:''}" title="${esc(s.title)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  const f=$('#yt'); f.addEventListener('load',()=>{try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1}),'*');}catch(e){}});
  updateFav();
}
let ytReady=false, skipT=0, lastT=0;
const au = document.getElementById('au');
const curIsAudio = () => !!(queue[qPos] && queue[qPos].audio);
function showAudio(s){ $('#audioBox').hidden=false; $('#audioCover').src=s.cover; if(au.getAttribute('src')!==s.audio) au.src=s.audio; else au.currentTime=0; au.play().catch(()=>setPlaying(false)); }
function hideAudio(){ try{au.pause();}catch(e){} $('#audioBox').hidden=true; }
au.addEventListener('play',()=>{ if(curIsAudio()) setPlaying(true); });
au.addEventListener('pause',()=>{ if(curIsAudio() && !au.ended) setPlaying(false); });
au.addEventListener('ended',()=>{ setPlaying(false); if(autoNext && qPos < queue.length-1){qPos++; loadCurrent();} else {$('#endedMsg').hidden=false;} });
au.addEventListener('error',()=>{ if(curIsAudio()){ setPlaying(false); toast('노래를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); } });
/* 다른 사이트에서 재생을 막아 둔 영상: 안내를 보여 주고, 전체 듣기 중이면 다음 곡으로 */
function onBlocked(){
  $('#blocked').hidden=false; setPlaying(false);
  if(autoNext && qPos < queue.length-1){ toast('이 곡은 여기서 안 나와서 다음 곡으로 넘어가요.'); skipT=setTimeout(()=>{qPos++; loadCurrent();},3000); }
}
function stopVideo(){ try{au.pause();}catch(e){} if($('#yt')&&ytReady){ userPaused=true; ytCmd('pauseVideo'); } else {$('#video').innerHTML='';} }
function ytCmdArgs(func,args){const f=$('#yt'); if(f) try{f.contentWindow.postMessage(JSON.stringify({event:'command',func,args}),'*');}catch(e){}}
window.addEventListener('message', e=>{
  if(!/youtube/.test(e.origin)) return;
  let d; try{d=typeof e.data==='string'?JSON.parse(e.data):e.data;}catch(x){return;}
  ytReady=true;
  if(curIsAudio()) return;
  if(d && d.event==='onError'){ onBlocked(); return; }
  const st = d && d.info && d.info.playerState;
  /* 재생 시간이 흘러가면 실제로 재생 중인 것: 레코드판을 돌려요 */
  const ct = d && d.info && d.info.currentTime;
  if(typeof ct==='number'){ if(ct > lastT + 0.05 && !isPlaying && !userPaused) setPlaying(true); lastT = ct; }
  if(st===2 && document.hidden && !userPaused){ ytCmd('playVideo'); return; }
  if(typeof st==='number') setPlaying(st===1 || st===3);
  if(st===0){ if(autoNext && qPos < queue.length-1){qPos++; loadCurrent();} else {$('#endedMsg').hidden=false;} }
});
/* 가운데 재생·멈춤 버튼 */
let isPlaying = true;
function setPlaying(v){
  isPlaying = v;
  $('#vinyl').classList.toggle('on', v); $('#arm').classList.toggle('on', v);
  $('#ppIcon').innerHTML = v ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('#ppLabel').textContent = v ? '멈춤' : '재생';
  $('#ppBtn').setAttribute('aria-label', v ? '멈춤' : '재생');
}
function ytCmd(func){const f=$('#yt'); if(f) try{f.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),'*');}catch(e){}}
$('#ppBtn').addEventListener('click',()=>{ if(curIsAudio()){ if(au.paused){userPaused=false; au.play().catch(()=>{}); $('#endedMsg').hidden=true;} else {userPaused=true; au.pause();} return; } if(isPlaying){userPaused=true; ytCmd('pauseVideo'); setPlaying(false);} else {userPaused=false; ytCmd('playVideo'); setPlaying(true); $('#endedMsg').hidden=true;} });
/* 홈 버튼을 눌러 앱이 뒤로 가도 노래가 이어지도록 다시 재생을 요청 (유튜브·폰 설정에 따라 막힐 수 있음) */
let userPaused = false;
document.addEventListener('visibilitychange',()=>{
  if(curIsAudio() || !$('#yt') || userPaused || $('#player').hidden) return;
  if(document.hidden){ [300,1000,2500].forEach(t=>setTimeout(()=>{ if(document.hidden && !userPaused) ytCmd('playVideo'); },t)); }
  else if(!isPlaying){ ytCmd('playVideo'); }
});
$('#prevBtn').addEventListener('click',()=>{ if(qPos>0){qPos--; loadCurrent();} else toast('첫 번째 곡이에요.'); });
$('#nextBtn').addEventListener('click',()=>{ if(qPos<queue.length-1){qPos++; loadCurrent();} else toast('마지막 곡이에요.'); });
$('#fsBtn').addEventListener('click',()=>{
  const v=$('#video'); const req=v.requestFullscreen||v.webkitRequestFullscreen;
  if(req){Promise.resolve(req.call(v)).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>toast('휴대폰을 옆으로 눕혀 보세요.'));}
  else toast('휴대폰을 옆으로 눕혀 보세요.');
});
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement){try{screen.orientation.unlock();}catch(e){}} });

function setAuto(v){autoNext=v; store.set('autoNext',v); $('#autoBtn').setAttribute('aria-checked', v?'true':'false'); $('#autoState').textContent=v?'켬':'끔';}
$('#autoBtn').addEventListener('click',()=>setAuto(!autoNext));
setAuto(autoNext);

function updateFav(){const s=queue[qPos]; const on=s&&favs.includes(s.id); $('#favBtn').classList.toggle('on',on); $('#favLabel').textContent=on?'자주 듣는 곡에 담았어요':'자주 듣는 곡에 담기';}
$('#favBtn').addEventListener('click',()=>{const s=queue[qPos]; if(!s) return;
  if(favs.includes(s.id)){favs=favs.filter(x=>x!==s.id); toast('자주 듣는 곡에서 뺐어요.');} else {favs.push(s.id); toast('자주 듣는 곡에 담았어요.');}
  store.set('favs',favs); updateFav();});

$('#editFavBtn').addEventListener('click',()=>{ favEdit=!favEdit; renderHome(); });
/* 목록 보내기: 휴대폰 공유창으로 가족에게 보내기 */
$('#shareBtn').addEventListener('click', async ()=>{
  const list = SONGS.filter(s=>favs.includes(s.id) || plays[s.id]);
  if(!list.length){toast('아직 담은 곡이 없어요.'); return;}
  const text = '최홍준님의 애창곡\n' + list.map((s,k)=>`${k+1}. ${s.title} - ${s.artist}`).join('\n');
  try{ if(navigator.share){await navigator.share({title:'최홍준님의 애창곡', text}); return;} }catch(e){ if(e && e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('목록을 복사했어요. 문자나 카톡에 붙여 넣으세요.'); }catch(e){ toast('이 휴대폰에서는 보내기가 안 돼요.'); }
});

if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
history.replaceState({view:'home'}, '');
renderHome();
</script>
</body>
</html>
